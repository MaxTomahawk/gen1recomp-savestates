name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rom-free:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Save States
        uses: actions/checkout@v4

      - name: Checkout verified Gen1Recomp API branch
        uses: actions/checkout@v4
        with:
          repository: MaxTomahawk/gen1recomp
          ref: 56db6b766d1f5a218079930a7c7526a6847a5a3e
          path: .upstream

      - name: Install ROM-free toolchain
        run: sudo apt-get update && sudo apt-get install -y luajit unzip

      - name: Test, validate, lint, and package
        run: make check GEN1RECOMP=.upstream
