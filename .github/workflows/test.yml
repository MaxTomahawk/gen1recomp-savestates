name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rom-free:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Save States
        uses: actions/checkout@v6

      - name: Checkout Gen1Recomp with proposed checkpoint lifecycle
        uses: actions/checkout@v6
        with:
          repository: MaxTomahawk/gen1recomp
          ref: aa3b2a18ec06d844f42be873278c5232628376fa
          path: .upstream

      - name: Install ROM-free toolchain
        run: sudo apt-get update && sudo apt-get install -y luajit unzip

      - name: Test, validate, lint, and package
        run: make check GEN1RECOMP=.upstream
