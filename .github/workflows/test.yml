name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rom-free:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Save States
        uses: actions/checkout@v6

      - name: Checkout Gen1Recomp with proposed battle API
        uses: actions/checkout@v6
        with:
          repository: MaxTomahawk/gen1recomp
          ref: 12b6ef6350984436f214d76e5407f1baba904ba1
          path: .upstream

      - name: Install ROM-free toolchain
        run: sudo apt-get update && sudo apt-get install -y luajit unzip

      - name: Test, validate, lint, and package
        run: make check GEN1RECOMP=.upstream
