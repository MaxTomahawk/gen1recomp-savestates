name: Track engine feature releases

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"

permissions:
  actions: write
  checks: write
  contents: write
  pull-requests: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Save States
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout Gen1Recomp release history
        uses: actions/checkout@v6
        with:
          repository: bryanthaboi/gen1recomp
          ref: main
          fetch-depth: 0
          path: .engine

      - name: Resolve merged and released feature status
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          first_release() {
            local commit="$1"
            if [ -z "$commit" ]; then return 0; fi
            while IFS= read -r tag; do
              if git -C .engine merge-base --is-ancestor "$commit" "$tag"; then
                printf '%s\n' "$tag"
                return 0
              fi
            done < <(git -C .engine tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=v:refname)
          }

          resolve_pr() {
            local number="$1" prefix="$2" merged_at commit state release
            merged_at="$(gh api "repos/bryanthaboi/gen1recomp/pulls/$number" --jq '.merged_at // ""')"
            commit="$(gh api "repos/bryanthaboi/gen1recomp/pulls/$number" --jq '.merge_commit_sha // ""')"
            state=open
            release=
            if [ -n "$merged_at" ]; then
              state=merged
              if ! git -C .engine cat-file -e "$commit^{commit}" 2>/dev/null; then
                git -C .engine fetch origin "$commit"
              fi
              release="$(first_release "$commit")"
            fi
            printf '%s_state=%s\n' "$prefix" "$state" >> "$GITHUB_OUTPUT"
            printf '%s_release=%s\n' "$prefix" "$release" >> "$GITHUB_OUTPUT"
            printf -v "${prefix}_state" '%s' "$state"
            printf -v "${prefix}_release" '%s' "$release"
            printf '%s: state=%s release=%s\n' "$prefix" "$state" "${release:-pending}" >> "$GITHUB_STEP_SUMMARY"
          }

          resolve_pr 1077 battle
          resolve_pr 1079 icon
          minimum_release=
          if [ -n "$battle_release" ] && [ -n "$icon_release" ]; then
            minimum_release="$(printf '%s\n%s\n' "$battle_release" "$icon_release" | sort -V | tail -1)"
          fi
          printf 'minimum_release=%s\n' "$minimum_release" >> "$GITHUB_OUTPUT"

      - name: Update compatibility and prepare the index handoff
        id: update
        env:
          BATTLE_STATE: ${{ steps.engine.outputs.battle_state }}
          BATTLE_RELEASE: ${{ steps.engine.outputs.battle_release }}
          ICON_STATE: ${{ steps.engine.outputs.icon_state }}
          ICON_RELEASE: ${{ steps.engine.outputs.icon_release }}
        run: |
          set -euo pipefail
          if [ -n "$BATTLE_RELEASE" ] && [ -n "$ICON_RELEASE" ]; then
            python3 tools/promote_engine_features.py . \
              --battle-release "$BATTLE_RELEASE" \
              --icon-release "$ICON_RELEASE"
          else
            minimum="v$(python3 -c 'import json; print(json.load(open("manifest.json"))["game_version"].split()[0][2:])')"
            args=(
              README.md
              --minimum "$minimum"
              --battle-state "$BATTLE_STATE"
              --icon-state "$ICON_STATE"
            )
            if [ -n "$BATTLE_RELEASE" ]; then
              args+=(--battle-release "$BATTLE_RELEASE")
            fi
            if [ -n "$ICON_RELEASE" ]; then
              args+=(--icon-release "$ICON_RELEASE")
            fi
            python3 tools/update_engine_feature_status.py "${args[@]}"
          fi
          if git diff --quiet -- README.md manifest.json mod.card \
            index/MaxTomahawk@savestates; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify exact stable package and index handoff
        if: ${{ steps.engine.outputs.battle_release != '' && steps.engine.outputs.icon_release != '' && steps.update.outputs.changed == 'true' }}
        env:
          MINIMUM_RELEASE: ${{ steps.engine.outputs.minimum_release }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y luajit unzip
          git -C .engine checkout --detach "$MINIMUM_RELEASE"
          make check GEN1RECOMP=.engine

          index_dir="$(mktemp -d)"
          git clone --depth 1 https://github.com/bryanthaboi/gen1recomp-mod-index.git "$index_dir"
          mkdir -p "$index_dir/mods/MaxTomahawk@savestates"
          cp index/MaxTomahawk@savestates/meta.json \
            index/MaxTomahawk@savestates/description.md \
            "$index_dir/mods/MaxTomahawk@savestates/"
          node "$index_dir/scripts/validate.mjs" \
            "$index_dir/mods/MaxTomahawk@savestates"
          (cd "$index_dir" && node scripts/build-index.mjs >/dev/null)

      - name: Open or refresh a reviewable pending-status PR
        if: ${{ steps.engine.outputs.battle_release == '' || steps.engine.outputs.icon_release == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BATTLE_STATE: ${{ steps.engine.outputs.battle_state }}
          BATTLE_RELEASE: ${{ steps.engine.outputs.battle_release }}
          ICON_STATE: ${{ steps.engine.outputs.icon_state }}
          ICON_RELEASE: ${{ steps.engine.outputs.icon_release }}
        run: |
          set -euo pipefail
          paths=(README.md manifest.json mod.card index/MaxTomahawk@savestates)
          if git diff --quiet -- "${paths[@]}"; then
            echo "Compatibility and index handoff already match released features."
            exit 0
          fi
          suffix="${BATTLE_STATE}-${BATTLE_RELEASE:-pending}-${ICON_STATE}-${ICON_RELEASE:-pending}"
          branch="automation/engine-feature-status-${suffix}"
          if [ "$(gh pr list --head "$branch" --state open --json number --jq 'length')" -gt 0 ]; then
            echo "A reviewable PR for this exact upstream state is already open."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "${paths[@]}"
          git commit -m "docs: promote released engine features"
          git push -u origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "docs: promote released engine features" \
            --body "Updates the public feature status after verifying upstream merge/release state. Stable promotion remains pending until one official Gen1Recomp release contains both #1077 and #1079; at that point the fail-closed automation selects the exact minimum, removes experimental, and publishes v0.1.0 after green gates."

      - name: Merge verified stable promotion and dispatch release
        if: ${{ steps.engine.outputs.battle_release != '' && steps.engine.outputs.icon_release != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_BRANCH: automation/engine-feature-status-${{ steps.engine.outputs.battle_state }}-${{ steps.engine.outputs.battle_release }}-${{ steps.engine.outputs.icon_state }}-${{ steps.engine.outputs.icon_release }}
          STABLE_TAG: v0.1.0
        run: bash tools/auto_promote_stable.sh
